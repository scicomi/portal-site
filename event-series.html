<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>イベント別 | SciComi Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header"></header>

    <!-- ページ内編集ウィザード（event-wizard.js）の入力候補 -->
    <datalist id="member-datalist"></datalist>
    <datalist id="experiment-datalist"></datalist>

    <main class="container">

        <!-- ===== シリーズ一覧モード（?key / ?event なしでアクセスした時） ===== -->
        <div id="series-index" class="hidden">
            <div class="page-header">
                <h1 class="page-title" style="margin:0; flex:1;">イベント別</h1>
                <input id="series-index-search" class="search-input" type="text" placeholder="イベント名・場所で検索" oninput="renderSeriesIndex()">
            </div>
            <div id="series-index-filters" class="page-filters">
                <button class="filter-chip active" data-sidx="event" aria-pressed="true" onclick="onSeriesIndexFilter('event')"><span class="cat-dot" style="color:#f8b4b4;">&#9679;</span>イベント</button>
                <button class="filter-chip" data-sidx="other" aria-pressed="false" onclick="onSeriesIndexFilter('other')"><span class="cat-dot" style="color:#86efac;">&#9679;</span>その他</button>
                <button class="filter-chip" data-sidx="all" aria-pressed="false" onclick="onSeriesIndexFilter('all')">全部</button>
                <button class="btn btn-primary btn-sm" style="margin-left:auto;" onclick="startSeriesPickMode()">＋ 新規イベント</button>
            </div>
            <div id="series-pick-banner" class="series-pick-banner hidden">
                <span>複製したいイベントのカードを選んでください</span>
                <div class="series-pick-actions">
                    <button type="button" class="btn btn-secondary btn-sm" onclick="goToNewEvent()">複製せず新しく作成</button>
                    <button type="button" class="btn btn-text btn-sm" onclick="cancelSeriesPickMode()">キャンセル</button>
                </div>
            </div>
            <div id="series-index-grid" class="series-index-grid">
                <div class="loading-text">読み込み中</div>
            </div>
        </div>

        <!-- ===== シリーズ詳細モード ===== -->
        <div id="series-view" class="hidden">
            <div style="margin-bottom: 16px; display:flex; gap:16px;">
                <a href="event-series.html" class="back-link">&larr; イベント別一覧</a>
                <a href="events.html" class="back-link">予定一覧へ</a>
            </div>

            <div id="series-loading" class="loading-text">読み込み中</div>

            <div id="series-content" class="hidden">
                <div class="series-header-card">
                    <div class="series-header-top">
                        <div class="series-header-titles">
                            <h1 id="series-title" class="series-title"></h1>
                            <p id="series-subtitle" class="series-subtitle"></p>
                        </div>
                        <div id="series-header-actions" class="series-header-actions"></div>
                    </div>
                    <div id="series-occ-selector"></div>
                </div>

                <div class="expd-tab-bar">
                    <button class="expd-tab active" data-tab="detail" onclick="switchSeriesTab(this)">イベント詳細</button>
                    <button class="expd-tab" data-tab="local-info" onclick="switchSeriesTab(this)">会場情報</button>
                    <button class="expd-tab" data-tab="stats" onclick="switchSeriesTab(this)">統計・開催履歴</button>
                </div>

                <!-- Tab: イベント詳細（サブタブ: 内容 / 参加状況 / 振り返り記入） -->
                <div class="expd-tab-pane" data-tab-pane="detail">
                    <div class="detail-sub-tab-bar">
                        <button class="detail-sub-tab active" data-subtab="content" onclick="switchDetailSubTab(this)">内容</button>
                        <button class="detail-sub-tab" data-subtab="attendance" onclick="switchDetailSubTab(this)">参加状況</button>
                        <button class="detail-sub-tab" data-subtab="reflection" onclick="switchDetailSubTab(this)">振り返りを記入</button>
                    </div>
                    <div class="detail-sub-pane" data-sub-pane="content">
                        <div id="series-detail"></div>
                    </div>
                    <div class="detail-sub-pane hidden" data-sub-pane="attendance">
                        <div id="series-attendance-detail"></div>
                    </div>
                    <div class="detail-sub-pane hidden" data-sub-pane="reflection">
                        <div id="series-reflection-entry"></div>
                    </div>
                </div>

                <!-- Tab: 会場情報（活動場所・緊急連絡先＋振り返りタイムライン） -->
                <div class="expd-tab-pane hidden" data-tab-pane="local-info">
                    <div id="series-safety-card" class="series-safety-card hidden">
                        <div class="series-safety-header">
                            <div class="series-safety-title">&#x1F6A8; 会場情報・緊急連絡先</div>
                            <button type="button" class="expd-section-edit-btn" title="編集" onclick="editSafetyInfo()">&#9998;</button>
                        </div>
                        <div id="series-safety-grid" class="series-safety-grid"></div>
                    </div>
                    <div class="expd-section">
                        <h2 class="expd-section-title">振り返り</h2>
                        <div class="expd-feedback-filters">
                            <button class="filter-chip active" data-fb="all" aria-pressed="true" onclick="filterSeriesFb('all')">全て</button>
                            <button class="filter-chip" data-fb="positive" aria-pressed="false" onclick="filterSeriesFb('positive')">良かった点</button>
                            <button class="filter-chip" data-fb="reflection" aria-pressed="false" onclick="filterSeriesFb('reflection')">改善点</button>
                        </div>
                        <div id="series-feedback-timeline"></div>
                    </div>
                </div>

                <!-- Tab: 統計・開催履歴（旧「概要」の開催カードもここに統合） -->
                <div class="expd-tab-pane hidden" data-tab-pane="stats">
                    <div id="series-stats"></div>
                    <h3 class="series-history-heading">開催履歴</h3>
                    <div id="series-overview-list"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
    <script src="search.js"></script>
    <script src="vote-widget.js"></script>
    <script src="event-wizard.js"></script>
    <script src="event-series.js"></script>
</body>
</html>
