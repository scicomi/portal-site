<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>ホーム | SciComi Site</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <script defer src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
</head>
<body>
    <header class="app-header"></header>

    <main class="container">
        <h1 class="sr-only">ホーム</h1>
        <div class="welcome-hero">
            <div class="welcome-msg-wrapper">
                <div id="welcome-msg"></div>
                <button type="button" id="welcome-edit-btn" class="expd-section-edit-btn hidden" title="メッセージを編集" onclick="editWelcomeMessage()">&#9998;</button>
            </div>
            <div id="welcome-editor-area" class="hidden"></div>
        </div>

        <!-- LINE公式アカウントの友だち追加案内（設定画面で友だち追加URLを登録すると表示される） -->
        <div id="line-invite-card" class="exp-recruit-card hidden">
            <div class="exp-recruit-header">
                <h3>LINEでイベント通知を受け取る</h3>
            </div>
            <p class="exp-recruit-note">新しいイベントが登録されると、公式アカウントからLINEでお知らせします。</p>
            <a id="line-invite-link" class="btn-recruit-link" href="#" target="_blank" rel="noopener">友だち追加する</a>
        </div>

        <div id="name-select-banner" class="vote-reminder-banner hidden">
            <span class="unanswered-flag">未設定</span>
            <span>出欠の回答に使う「名前」が未設定です。</span>
            <div class="vote-reminder-action">
                <select id="name-select-banner-select" class="e1-input" aria-label="あなたの名前を選択">
                    <option value="">-- 名前を選択 --</option>
                </select>
                <button id="name-select-banner-btn" class="btn btn-sm btn-primary-solid" disabled>設定</button>
            </div>
        </div>
        <div id="vote-reminder-banner" class="vote-reminder-banner hidden">
            <span class="unanswered-flag">未回答</span>
            <span id="vote-reminder-text"></span>
            <a id="vote-reminder-link" href="#" class="btn btn-sm btn-primary-solid">出欠を回答</a>
        </div>

        <div class="dash-stats" id="dash-stats">
            <a href="events.html" class="stat-card"><div class="stat-num" id="stat-upcoming">&mdash;</div><div class="stat-label">今後の予定</div></a>
            <a href="members.html" class="stat-card"><div class="stat-num" id="stat-members">&mdash;</div><div class="stat-label">メンバー</div></a>
            <a href="experiments.html" class="stat-card"><div class="stat-num" id="stat-experiments">&mdash;</div><div class="stat-label">実験ネタ</div></a>
        </div>

        <!-- 開閉はカード単位。片付いた項目だけを畳めるよう、見出しごとにトグルを置く -->
        <section class="dash-section" id="action-needed" style="display:none;">
            <h2 class="page-header">対応が必要</h2>
            <div class="dashboard-grid" id="action-needed-body">
                <div class="dash-card dash-card--alert dash-card--collapsed">
                    <h3 class="dash-card-title">
                        <button type="button" class="dash-card-toggle" aria-expanded="false" aria-controls="upcoming-kyoka" onclick="toggleActionCard(this)">
                            <span class="dash-card-toggle-label">許可願の期限（イベント前）</span>
                            <span class="dash-card-count" id="count-upcoming-kyoka"></span>
                            <span class="dash-card-toggle-icon" aria-hidden="true">&#9662;</span>
                        </button>
                    </h3>
                    <ul class="dash-list hidden" id="upcoming-kyoka"></ul>
                </div>
                <div class="dash-card dash-card--alert dash-card--collapsed">
                    <h3 class="dash-card-title">
                        <button type="button" class="dash-card-toggle" aria-expanded="false" aria-controls="upcoming-deadlines" onclick="toggleActionCard(this)">
                            <span class="dash-card-toggle-label">報告書の期限（イベント後）</span>
                            <span class="dash-card-count" id="count-upcoming-deadlines"></span>
                            <span class="dash-card-toggle-icon" aria-hidden="true">&#9662;</span>
                        </button>
                    </h3>
                    <ul class="dash-list hidden" id="upcoming-deadlines"></ul>
                </div>
                <div class="dash-card dash-card--alert dash-card--collapsed">
                    <h3 class="dash-card-title">
                        <button type="button" class="dash-card-toggle" aria-expanded="false" aria-controls="feedback-pending" onclick="toggleActionCard(this)">
                            <span class="dash-card-toggle-label">振り返り未記入</span>
                            <span class="dash-card-count" id="count-feedback-pending"></span>
                            <span class="dash-card-toggle-icon" aria-hidden="true">&#9662;</span>
                        </button>
                    </h3>
                    <ul class="dash-list" id="feedback-pending"></ul>
                </div>
            </div>
        </section>

        <section class="dash-section">
            <div class="dash-section-heading">
                <h3 class="page-header">概要</h3>
                <a href="events.html" class="dash-section-link">すべての予定 →</a>
            </div>
            <div class="dash-card home-calendar-card">
                <div id="home-calendar" class="home-calendar"></div>
            </div>
        </section>

        <!-- リンク集（設定画面「リンク集」で登録したURLを並べる。未登録なら非表示） -->
        <section class="dash-section" id="site-links-section" style="display:none;">
            <h2 class="page-header">リンク集</h2>
            <div class="dash-card">
                <div id="site-links-list" class="site-link-grid"></div>
            </div>
        </section>
    </main>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
    <script src="vote-widget.js"></script>
    <script src="home.js"></script>
</body>
</html>
