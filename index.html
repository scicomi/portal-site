<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>ホーム | SciComi Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header"></header>

    <main class="container">
        <div class="welcome-hero">
            <div class="welcome-msg-wrapper">
                <div id="welcome-msg"></div>
                <button type="button" id="welcome-edit-btn" class="expd-section-edit-btn hidden" title="メッセージを編集" onclick="editWelcomeMessage()">&#9998;</button>
            </div>
            <div id="welcome-editor-area" class="hidden"></div>
            <div class="quick-actions">
                <a href="events.html?action=new" class="quick-action-btn">+ 予定を追加</a>
                <a href="events.html" class="quick-action-btn">予定を見る</a>
                <a href="experiments.html" class="quick-action-btn">実験ネタを見る</a>
            </div>
        </div>

        <div id="name-select-banner" class="vote-reminder-banner hidden">
            <span class="unanswered-flag">未設定</span>
            <span>出欠の回答などに使う「あなたの名前」が未設定です。</span>
            <div class="vote-reminder-action">
                <select id="name-select-banner-select" class="e1-input">
                    <option value="">-- 名前を選択 --</option>
                </select>
                <button id="name-select-banner-btn" class="btn btn-sm btn-primary-solid" disabled>設定</button>
            </div>
        </div>
        <div id="vote-reminder-banner" class="vote-reminder-banner hidden">
            <span class="unanswered-flag">未回答</span>
            <span id="vote-reminder-text"></span>
            <a id="vote-reminder-link" href="#" class="btn btn-sm btn-primary-solid">出欠を回答</a>
        </div>

        <div class="dash-stats" id="dash-stats">
            <div class="stat-card"><div class="stat-num" id="stat-upcoming">&mdash;</div><div class="stat-label">今後の予定</div></div>
            <div class="stat-card"><div class="stat-num" id="stat-members">&mdash;</div><div class="stat-label">メンバー</div></div>
            <div class="stat-card"><div class="stat-num" id="stat-experiments">&mdash;</div><div class="stat-label">実験ネタ</div></div>
        </div>

        <section class="dash-section" id="action-needed" style="display:none;">
            <h3 class="page-header">対応が必要</h3>
            <div class="dashboard-grid">
                <div class="dash-card dash-card--alert">
                    <h3 class="dash-card-title">許可願の期限（イベント前）</h3>
                    <ul class="dash-list" id="upcoming-kyoka"></ul>
                </div>
                <div class="dash-card dash-card--alert">
                    <h3 class="dash-card-title">報告書の期限（イベント後）</h3>
                    <ul class="dash-list" id="upcoming-deadlines"></ul>
                </div>
                <div class="dash-card dash-card--alert">
                    <h3 class="dash-card-title">振り返り未記入</h3>
                    <ul class="dash-list" id="feedback-pending"></ul>
                </div>
            </div>
        </section>

        <section class="dash-section">
            <h3 class="page-header">概要</h3>
            <div class="dashboard-grid">
                <div class="dash-card">
                    <h3 class="dash-card-title">直近の予定 <a href="events.html">すべて見る →</a></h3>
                    <ul class="dash-list" id="upcoming-events"><li class="loading-text">読み込み中</li></ul>
                </div>
                <div class="dash-card">
                    <h3 class="dash-card-title">メンバー <a href="members.html">一覧 →</a></h3>
                    <ul class="dash-list" id="member-summary"><li class="loading-text">読み込み中</li></ul>
                </div>
            </div>
        </section>
    </main>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
    <script src="vote-widget.js"></script>
    <script src="home.js"></script>
</body>
</html>
