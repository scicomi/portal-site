<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>日程 | SciComi Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://script.google.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
    <script defer src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
</head>

<body>
    <header class="app-header"></header>

    <datalist id="member-datalist"></datalist>
    <datalist id="experiment-datalist"></datalist>

    <main class="container">
        <div class="page-header">
            <h1 class="page-title" style="margin:0; flex:1;">日程</h1>
            <input id="event-search" class="search-input" type="text" placeholder="タイトル・場所・発表者で検索" title="ショートカット: / キーで検索欄へ" oninput="onSearchChange()">
            <button class="btn btn-primary page-new-btn" onclick="openNewEventModal()" title="ショートカット: n キー">＋ 日程を追加</button>
        </div>
        <div class="page-filters">
            <button class="filter-chip active" data-cat="all" aria-pressed="true" onclick="onCategoryFilter('all')">全部</button>
            <button class="filter-chip" data-cat="normal" aria-pressed="false" onclick="onCategoryFilter('normal')">イベント</button>
            <button class="filter-chip" data-cat="other" aria-pressed="false" onclick="onCategoryFilter('other')">その他</button>
            <button class="filter-chip" data-cat="general" aria-pressed="false" onclick="onCategoryFilter('general')">全体MTG</button>
            <button class="filter-chip" data-cat="admin" aria-pressed="false" onclick="onCategoryFilter('admin')">幹部MTG</button>
            <span class="filter-divider"></span>
            <select id="period-filter" class="e1-input" style="width:auto; padding:4px 10px; font-size:0.85rem;" title="表示する期間" onchange="onPeriodFilter(this.value)">
                <option value="upcoming" selected>今後</option>
            </select>
            <button class="btn btn-secondary btn-sm" id="calendar-toggle-btn" aria-pressed="false" onclick="toggleCalendar()" style="margin-left:auto;">カレンダーを表示</button>
        </div>

        <section id="calendar-wrapper" class="calendar-section hidden">
            <div id="calendar"></div>
        </section>

        <h3 id="event-list-heading" class="event-list-heading"></h3>
        <div class="table-wrapper">
            <table class="data-table" id="events-table">
                <thead>
                    <tr>
                        <th>日付</th>
                        <th>タイトル</th>
                        <th style="width:1px;"></th>
                    </tr>
                </thead>
                <tbody id="events-tbody">
                    <tr class="skeleton-row"><td><div class="skeleton" style="width:90px;height:16px;"></div></td><td><div class="skeleton" style="width:60%;height:16px;display:inline-block;"></div><div class="skeleton" style="width:50px;height:18px;display:inline-block;margin-left:8px;border-radius:10px;"></div></td><td></td></tr>
                    <tr class="skeleton-row"><td><div class="skeleton" style="width:90px;height:16px;"></div></td><td><div class="skeleton" style="width:45%;height:16px;display:inline-block;"></div><div class="skeleton" style="width:60px;height:18px;display:inline-block;margin-left:8px;border-radius:10px;"></div></td><td></td></tr>
                    <tr class="skeleton-row"><td><div class="skeleton" style="width:90px;height:16px;"></div></td><td><div class="skeleton" style="width:70%;height:16px;display:inline-block;"></div><div class="skeleton" style="width:40px;height:18px;display:inline-block;margin-left:8px;border-radius:10px;"></div></td><td></td></tr>
                    <tr class="skeleton-row"><td><div class="skeleton" style="width:90px;height:16px;"></div></td><td><div class="skeleton" style="width:55%;height:16px;display:inline-block;"></div><div class="skeleton" style="width:55px;height:18px;display:inline-block;margin-left:8px;border-radius:10px;"></div></td><td></td></tr>
                    <tr class="skeleton-row"><td><div class="skeleton" style="width:90px;height:16px;"></div></td><td><div class="skeleton" style="width:50%;height:16px;display:inline-block;"></div><div class="skeleton" style="width:45px;height:18px;display:inline-block;margin-left:8px;border-radius:10px;"></div></td><td></td></tr>
                </tbody>
            </table>
        </div>
    </main>


    <!-- 複製選択モードのバナー（script.js で表示制御） -->
    <div id="duplicate-mode-banner" class="duplicate-mode-banner hidden">
        <div class="duplicate-mode-inner">
            <span class="duplicate-mode-text">複製する日程をタップしてください</span>
            <div class="duplicate-mode-actions">
                <button class="btn btn-text" onclick="startNewEventBlank()">白紙から作成</button>
                <button class="btn btn-secondary btn-sm" onclick="exitDuplicateMode()">キャンセル</button>
            </div>
        </div>
    </div>
    <!-- 行タップ→概要ポップアップ（script.js openEventPreviewModal）。フル情報は event-series.html?event=<ID> へ -->

    <!-- FAB -->
    <button class="fab" onclick="openNewEventModal()" aria-label="日程を追加"><span class="fab-icon">＋</span>日程を追加</button>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
    <script src="vote-widget.js"></script>
    <script src="event-wizard.js"></script>
    <script src="script.js"></script>
</body>

</html>
