<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>予定 | SciComi Site</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="app-header"></header>

    <datalist id="experiment-datalist"></datalist>

    <main class="container">
        <div class="page-header">
            <h1 class="page-title">予定</h1>
            <div class="ev-search-row">
                <div class="search-box" role="search">
                    <input id="event-search" class="search-input" type="search" placeholder="イベント名・企画名・場所で検索"
                        title="ショートカット: / キーで検索欄へ" aria-label="予定を検索"
                        role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="event-search-suggest"
                        autocomplete="off">
                    <ul id="event-search-suggest" class="search-suggest" role="listbox" aria-label="検索候補" hidden></ul>
                </div>
                <div class="ev-filter-anchor" id="ev-filter-anchor">
                    <button type="button" class="btn btn-secondary ev-filter-btn" id="ev-filter-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="ev-filter-panel" onclick="toggleFilterPanel()">絞り込み<span class="ev-filter-badge hidden" id="ev-filter-badge"></span></button>
                    <div class="ev-filter-scrim hidden" id="ev-filter-scrim" onclick="toggleFilterPanel(false)"></div>
                    <div class="ev-filter-panel hidden" id="ev-filter-panel" role="dialog" aria-label="絞り込み">
                        <div class="ev-filter-label">期間</div>
                        <div class="ev-filter-chips" id="period-chips"></div>
                        <select id="period-filter" class="ev-filter-select" aria-label="それ以前の年度で絞り込む" onchange="onPeriodFilter(this.value)"></select>
                        <div class="ev-filter-label">カテゴリ</div>
                        <div class="ev-filter-chips">
                            <button class="filter-chip active" data-cat="all" aria-pressed="true" onclick="onCategoryFilter('all')"><span class="chip-label">全部</span></button>
                            <button class="filter-chip" data-cat="normal" aria-pressed="false" onclick="onCategoryFilter('normal')"><span class="cat-dot" style="color:#f8b4b4;" aria-hidden="true">&#9679;</span><span class="chip-label">イベント</span></button>
                            <button class="filter-chip" data-cat="other" aria-pressed="false" onclick="onCategoryFilter('other')"><span class="cat-dot" style="color:#86efac;" aria-hidden="true">&#9679;</span><span class="chip-label">その他</span></button>
                            <button class="filter-chip" data-cat="general" aria-pressed="false" onclick="onCategoryFilter('general')"><span class="cat-dot" style="color:#93c5fd;" aria-hidden="true">&#9679;</span><span class="chip-label">全体MTG</span></button>
                            <button class="filter-chip" data-cat="admin" aria-pressed="false" onclick="onCategoryFilter('admin')"><span class="cat-dot" style="color:#fde68a;" aria-hidden="true">&#9679;</span><span class="chip-label">幹部MTG</span></button>
                        </div>
                        <div class="ev-filter-foot">
                            <button class="btn btn-text btn-sm" id="filter-reset-btn" onclick="resetFilters()" title="検索・絞り込みをすべて解除">条件をクリア</button>
                            <button type="button" class="btn btn-primary btn-sm" onclick="toggleFilterPanel(false)">閉じる</button>
                        </div>
                    </div>
                </div>
            </div>
            <button class="btn btn-primary page-new-btn" onclick="openNewEventModal()" title="ショートカット: n キー">＋ 予定を追加</button>
        </div>

        <div class="event-list-top">
            <h3 id="event-list-heading" class="event-list-heading" aria-live="polite"></h3>
            <div id="ev-vote-member-bar" class="ev-vote-member-bar hidden">
                <span id="ev-vote-who" class="ev-vote-who"></span>
                <button type="button" id="ev-vote-change" class="btn btn-text btn-sm" onclick="startChangeVoteMember()">変更</button>
                <select id="ev-vote-member-select" aria-label="出欠回答に使うあなたの名前">
                    <option value="">-- 選択 --</option>
                </select>
            </div>
        </div>
        <div class="table-wrapper">
            <table class="data-table" id="events-table">
                <thead>
                    <tr>
                        <th>日付</th>
                        <th>タイトル</th>
                        <th class="ev-vote-cell">参加を回答</th>
                        <th>参加者数</th>
                        <th style="width:1px;"></th>
                    </tr>
                </thead>
                <tbody id="events-tbody">
                    <tr class="skeleton-row"><td><div class="skeleton" style="width:90px;height:16px;"></div></td><td><div class="skeleton" style="width:60%;height:16px;display:inline-block;"></div></td><td></td><td><div class="skeleton" style="width:50px;height:18px;border-radius:10px;"></div></td><td></td></tr>
                    <tr class="skeleton-row"><td><div class="skeleton" style="width:90px;height:16px;"></div></td><td><div class="skeleton" style="width:45%;height:16px;display:inline-block;"></div></td><td></td><td><div class="skeleton" style="width:60px;height:18px;border-radius:10px;"></div></td><td></td></tr>
                    <tr class="skeleton-row"><td><div class="skeleton" style="width:90px;height:16px;"></div></td><td><div class="skeleton" style="width:70%;height:16px;display:inline-block;"></div></td><td></td><td><div class="skeleton" style="width:40px;height:18px;border-radius:10px;"></div></td><td></td></tr>
                    <tr class="skeleton-row"><td><div class="skeleton" style="width:90px;height:16px;"></div></td><td><div class="skeleton" style="width:55%;height:16px;display:inline-block;"></div></td><td></td><td><div class="skeleton" style="width:55px;height:18px;border-radius:10px;"></div></td><td></td></tr>
                    <tr class="skeleton-row"><td><div class="skeleton" style="width:90px;height:16px;"></div></td><td><div class="skeleton" style="width:50%;height:16px;display:inline-block;"></div></td><td></td><td><div class="skeleton" style="width:45px;height:18px;border-radius:10px;"></div></td><td></td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- FAB -->
    <button class="fab" onclick="openNewEventModal()" aria-label="予定を追加"><span class="fab-icon">＋</span>予定を追加</button>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
    <script src="search.js"></script>
    <script src="vote-widget.js"></script>
    <script src="event-wizard.js"></script>
    <script src="event-fields.js"></script>
    <script src="script.js"></script>
</body>

</html>
