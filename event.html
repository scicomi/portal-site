<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <script src="theme-init.js"></script>
    <title>イベント詳細 | SciComi Site</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header"></header>

    <!-- ページ内編集ウィザード（event-wizard.js）の入力候補 -->
    <datalist id="experiment-datalist"></datalist>

    <main class="container">

        <!-- ===== シリーズ詳細モード ===== -->
        <div id="series-view" class="hidden">
            <div style="margin-bottom: 16px; display:flex; gap:16px;">
                <a href="events.html" class="back-link">&larr; 予定一覧へ</a>
            </div>

            <div id="series-loading" class="loading-text">読み込み中</div>

            <div id="series-content" class="hidden">
                <div class="series-header-card">
                    <div class="series-header-top">
                        <div class="series-header-titles">
                            <h1 id="series-title" class="series-title"></h1>
                        </div>
                        <div id="series-header-actions" class="series-header-actions"></div>
                    </div>
                    <!-- 開催回の選択（複数回あるときだけ表示）。プルダウンだけで切り替える -->
                    <div id="series-occ-picker" class="series-occ-picker"></div>
                </div>

                <!-- 1段フラットタブ。会場だけは全開催回が対象（data-zone="series"）で、下の対象範囲バーに期間を出す -->
                <div class="scope-tab-bar" id="series-tab-bar" role="tablist" aria-label="イベント情報の切り替え">
                    <button class="scope-tab active" role="tab" aria-selected="true" data-tab="summary" data-zone="occ" onclick="switchSeriesTab(this)">概要<span class="scope-badge hidden" id="scope-badge-summary"></span></button>
                    <button class="scope-tab" role="tab" aria-selected="false" data-tab="attendance" data-zone="occ" onclick="switchSeriesTab(this)">出欠<span class="scope-badge hidden" id="scope-badge-attendance"></span></button>
                    <button class="scope-tab" role="tab" aria-selected="false" data-tab="reflection" data-zone="occ" onclick="switchSeriesTab(this)">振り返り</button>
                    <button class="scope-tab" role="tab" aria-selected="false" data-tab="venue" data-zone="series" onclick="switchSeriesTab(this)">会場</button>
                </div>

                <!-- 対象範囲バー: 「会場」のときだけ対象期間を出す（開催回の選択はヘッダーカード内） -->
                <div class="scope-ctx" id="series-scope-ctx"></div>

                <!-- 概要 -->
                <div class="scope-pane" role="tabpanel" tabindex="0" data-pane="summary">
                    <div id="series-detail"></div>
                </div>

                <!-- 出欠 -->
                <div class="scope-pane hidden" role="tabpanel" tabindex="0" data-pane="attendance">
                    <div id="series-attendance-detail"></div>
                </div>

                <!-- 振り返り（記入と表示を1か所に統合） -->
                <div class="scope-pane hidden" role="tabpanel" tabindex="0" data-pane="reflection">
                    <div id="series-reflection-entry"></div>
                    <div id="series-results-view"></div>
                </div>

                <!-- 会場（全開催回が対象） -->
                <div class="scope-pane hidden" role="tabpanel" tabindex="0" data-pane="venue">
                    <div id="series-safety-card" class="series-safety-card hidden">
                        <div class="series-safety-header">
                            <div class="series-safety-title">会場情報・緊急連絡先</div>
                            <button type="button" class="expd-section-edit-btn" title="編集" onclick="editSafetyInfo()">&#9998;</button>
                        </div>
                        <div id="series-safety-grid" class="series-safety-grid"></div>
                    </div>
                    <h3 class="series-history-heading">会場運営の振り返り</h3>
                    <div class="expd-feedback-filters">
                        <button class="filter-chip active" data-fb="all" aria-pressed="true" onclick="filterSeriesFb('all')">全て</button>
                        <button class="filter-chip" data-fb="positive" aria-pressed="false" onclick="filterSeriesFb('positive')">良かった点</button>
                        <button class="filter-chip" data-fb="reflection" aria-pressed="false" onclick="filterSeriesFb('reflection')">改善点</button>
                    </div>
                    <div id="series-feedback-timeline"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
    <script src="search.js"></script>
    <script src="vote-widget.js"></script>
    <script src="event-wizard.js"></script>
    <script src="event-fields.js"></script>
    <script src="event.js"></script>
</body>
</html>
