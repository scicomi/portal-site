<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>実験詳細 | SciComi Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header"></header>

    <main class="container">
        <div style="margin-bottom: 16px;">
            <a href="experiments.html" class="back-link">&larr; 実験一覧に戻る</a>
        </div>

        <div id="exp-loading" class="loading-text">読み込み中</div>

        <div id="exp-content" class="hidden">
            <!-- Experiment Info Card（タイトル・バッジ・編集のみのコンパクト表示。
                 使用物品/事前準備/発表の流れ/注意事項は「実験情報」タブへ移動） -->
            <div class="expd-info-card">
                <div class="expd-info-header">
                    <h1 id="expd-name" class="expd-title"></h1>
                    <div class="expd-header-actions">
                        <span id="expd-cat-badge" class="cat-badge"></span>
                        <a id="expd-slides-link" class="tbl-link hidden" target="_blank">資料を開く</a>
                    </div>
                </div>
            </div>

            <!-- Tab Bar -->
            <div class="expd-tab-bar" role="tablist" aria-label="実験詳細の表示切り替え">
                <button class="expd-tab active" role="tab" aria-selected="true" data-tab="info" onclick="switchExpTab(this)">実験情報</button>
                <button class="expd-tab" role="tab" aria-selected="false" data-tab="feedback" onclick="switchExpTab(this)">振り返り</button>
                <button class="expd-tab" role="tab" aria-selected="false" data-tab="media" onclick="switchExpTab(this)">メディア</button>
            </div>

            <!-- Tab: Info（使用物品・事前準備・発表の流れ・注意事項をここで表示） -->
            <div class="expd-tab-pane" role="tabpanel" tabindex="0" data-tab-pane="info">
                <div class="expd-section">
                    <div id="expd-info-body"></div>
                </div>
                <div id="expd-events-section" class="expd-section hidden">
                    <div class="expd-section-header">
                        <h2 class="expd-section-title">実施イベント</h2>
                        <select id="expd-events-fy-select" class="expd-fy-select" aria-label="表示する年度で絞り込む" onchange="onEventsFyFilterChange()"></select>
                    </div>
                    <div id="expd-events-list"></div>
                </div>
            </div>

            <!-- Tab: Feedback -->
            <div class="expd-tab-pane hidden" role="tabpanel" tabindex="0" data-tab-pane="feedback">
                <div class="expd-section">
                    <div class="expd-section-header">
                        <h2 class="expd-section-title">振り返り</h2>
                        <button class="btn-primary-solid" style="width:auto; padding:6px 16px; font-size:0.85rem;" onclick="openAddFeedback()">＋ 振り返りを追加</button>
                    </div>
                    <div class="expd-feedback-filters">
                        <button class="filter-chip active" data-fb="all" aria-pressed="true" onclick="filterFeedback('all')">全て</button>
                        <button class="filter-chip" data-fb="positive" aria-pressed="false" onclick="filterFeedback('positive')">良かった点</button>
                        <button class="filter-chip" data-fb="reflection" aria-pressed="false" onclick="filterFeedback('reflection')">改善点</button>
                        <input id="feedback-search" class="search-input" type="search" placeholder="キーワードで検索" aria-label="振り返りを検索" style="max-width:220px; margin-left:auto;" autocomplete="off">
                    </div>
                    <div id="feedback-timeline"></div>
                </div>
            </div>

            <!-- Tab: Media（写真と動画） -->
            <div class="expd-tab-pane hidden" role="tabpanel" tabindex="0" data-tab-pane="media">
                <div class="expd-section">
                    <div class="expd-section-header">
                        <h2 class="expd-section-title">写真</h2>
                        <button id="photo-add-btn" class="btn-primary-solid hidden" style="width:auto; padding:6px 16px; font-size:0.85rem;" onclick="openPhotoUpload()">＋ 写真を追加</button>
                    </div>
                    <p class="expd-note">活動写真はTeamsに保存してください。ここに掲載できるのは、実験の様子が分かる代表的な15枚までです。</p>
                    <div id="expd-photo-gallery" class="photo-gallery">
                        <p class="empty-state" style="padding:30px 20px;">写真はまだありません</p>
                    </div>
                    <input type="file" id="photo-file-input" accept="image/*" multiple style="display:none;" onchange="handlePhotoSelect(this)">
                </div>

                <!-- 動画（YouTubeリンクを登録し、実験ショーの様子を見返せるようにする） -->
                <div class="expd-section">
                    <div class="expd-section-header">
                        <h2 class="expd-section-title">動画</h2>
                        <button id="video-add-btn" class="btn-primary-solid hidden" style="width:auto; padding:6px 16px; font-size:0.85rem;" onclick="openAddVideoModal()">＋ 動画を追加</button>
                    </div>
                    <p class="expd-note">YouTubeのリンクを登録すると、実験ショーの様子をここで見返せます。サムネイルをクリックすると再生されます。</p>
                    <div id="expd-video-gallery" class="video-gallery"></div>
                    <button type="button" id="video-load-more" class="btn btn-secondary hidden" style="width:auto; padding:8px 24px; margin:16px auto 0;" onclick="showMoreVideos()">もっと見る</button>
                </div>
            </div>
        </div>

        <!-- Add Video Modal -->
        <div id="video-modal" class="modal-overlay hidden">
            <div class="modal-content" style="max-width:480px;" role="dialog" aria-modal="true" aria-labelledby="video-modal-title">
                <div class="modal-header">
                    <h2 id="video-modal-title">動画を追加</h2>
                </div>
                <div class="modal-body">
                    <div class="e1-group">
                        <label class="e1-label">YouTube URL *</label>
                        <input type="text" id="video-url" class="e1-input" placeholder="https://www.youtube.com/watch?v=...">
                    </div>
                    <div class="e1-group">
                        <label class="e1-label">タイトル（任意）</label>
                        <input type="text" id="video-title" class="e1-input" maxlength="80" placeholder="例: 2025年度 秋季イベント本番">
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-text" onclick="closeVideoModal()">キャンセル</button>
                        <button id="video-save-btn" class="btn btn-primary-solid" style="width:auto;" onclick="saveVideo()">保存</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Add Feedback Modal -->
        <div id="feedback-modal" class="modal-overlay hidden">
            <div class="modal-content" style="max-width:520px;" role="dialog" aria-modal="true" aria-labelledby="fb-modal-title">
                <div class="modal-header">
                    <h2 id="fb-modal-title">振り返りを追加</h2>
                </div>
                <div class="modal-body">
                    <div class="e1-group">
                        <label class="e1-label">種別</label>
                        <select id="fb-type" class="e1-input">
                            <option value="positive">良かった点</option>
                            <option value="reflection">改善点</option>
                        </select>
                    </div>
                    <div class="e1-group">
                        <label class="e1-label">関連イベント（任意）</label>
                        <select id="fb-event" class="e1-input">
                            <option value="">-- なし（実験全般） --</option>
                        </select>
                    </div>
                    <div class="e1-group">
                        <label class="e1-label">内容 *</label>
                        <textarea id="fb-text" class="e1-input" rows="4" placeholder="振り返りの内容"></textarea>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-text" onclick="closeFeedbackModal()">キャンセル</button>
                        <button id="fb-save-btn" class="btn btn-primary-solid" style="width:auto;" onclick="saveFeedback()">保存</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
    <script src="search.js"></script>
    <script src="experiment-detail.js"></script>
</body>
</html>
