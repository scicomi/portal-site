<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>パスワード一覧 | SciComi Site</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header"></header>

    <main class="container">
        <!-- 管理者でない場合に表示するブロック -->
        <div id="pw-denied" class="pw-denied" style="display:none;">
            <h1 class="page-title">パスワード一覧</h1>
            <p>このページは管理者専用です。幹部パスワードで認証してください。</p>
            <button class="btn btn-primary-solid" style="width:auto;padding:8px 20px;" onclick="showAdminAuthModal(() => location.reload())">管理者認証</button>
        </div>

        <!-- 管理者向け本体 -->
        <div id="pw-admin-body" style="display:none;">
            <div class="page-section-actions">
                <h1 class="page-title" style="margin:0; flex:1;">パスワード一覧</h1>
                <input id="pw-search" class="search-input" type="search" placeholder="サービス名・IDで検索" aria-label="パスワード一覧を検索" autocomplete="off">
                <button class="btn-primary-solid" style="width: auto; padding: 8px 16px;" onclick="openPwModal()">＋ 追加</button>
            </div>

            <p class="pw-security-note">
                ⚠ 外部サービスのログイン情報です。<strong>管理者のみ閲覧できます。</strong>画面共有・スクリーンショットの取り扱いに注意してください。
            </p>

            <div id="pw-cat-filter" class="pw-cat-filter"></div>

            <div id="pw-list" class="pw-list"></div>
        </div>

        <!-- 追加・編集モーダル（Step 1: 基本情報 / Step 2: 認証情報・写真の2段階） -->
        <div id="pw-modal-edit" class="modal-overlay hidden">
            <div class="wizard-panel" style="max-width: 500px;" role="dialog" aria-modal="true" aria-labelledby="pw-modal-title">
                <div class="wizard-header">
                    <h2 class="wizard-title" id="pw-modal-title">パスワードを追加</h2>
                </div>
                <div class="wizard-progress">
                    <button type="button" class="wizard-step-dot active" data-pw-dot="0" title="Step 1へ移動" onclick="pwWizardGoto(0)">1</button>
                    <div class="wizard-step-line" data-pw-line="1"></div>
                    <button type="button" class="wizard-step-dot" data-pw-dot="1" title="Step 2へ移動" onclick="pwWizardGoto(1)">2</button>
                </div>
                <div class="wizard-body">
                    <div class="wizard-step active" data-pw-step="0">
                        <div class="wizard-step-label">Step 1 / 2 &mdash; 基本情報</div>
                        <div class="e1-group">
                            <label class="e1-label">カテゴリ</label>
                            <select id="pw-f-category" class="e1-input"></select>
                        </div>
                        <div class="e1-group">
                            <label class="e1-label">サービス名 *</label>
                            <input id="pw-f-name" class="e1-input" type="text" placeholder="例: モノタロウ">
                        </div>
                        <div class="e1-group">
                            <label class="e1-label">サービスのURL</label>
                            <input id="pw-f-url" class="e1-input" type="text" placeholder="例: https://www.monotaro.com/">
                        </div>
                        <div class="e1-group">
                            <label class="e1-label">ログイン方法</label>
                            <select id="pw-f-logintype" class="e1-input" onchange="onLoginTypeChange()"></select>
                        </div>
                    </div>
                    <div class="wizard-step" data-pw-step="1">
                        <div class="wizard-step-label">Step 2 / 2 &mdash; 認証情報・写真</div>
                        <div class="e1-group">
                            <label class="e1-label">ID / メールアドレス</label>
                            <input id="pw-f-loginid" class="e1-input" type="text" placeholder="例: example@example.com または user1234" autocomplete="off">
                        </div>
                        <div class="e1-group" id="pw-f-password-group">
                            <label class="e1-label">パスワード</label>
                            <div style="display:flex;gap:8px;">
                                <input id="pw-f-password" class="e1-input" type="password" placeholder="パスワード" autocomplete="new-password" style="flex:1;">
                                <button type="button" class="btn btn-secondary" style="width:auto;padding:8px 12px;font-size:0.82rem;" onclick="togglePwField('pw-f-password', this)" title="表示切替">表示</button>
                            </div>
                        </div>
                        <div class="e1-group">
                            <label class="e1-label">メモ（複数行OK：バックアップコード、2FA手順など）</label>
                            <textarea id="pw-f-note" class="e1-input" rows="5" placeholder="例: 部費の備品購入用アカウント&#10;&#10;バックアップコード:&#10;xxxx-xxxx&#10;yyyy-yyyy"></textarea>
                        </div>
                        <div class="e1-group">
                            <label class="e1-label">写真（QRコードや設定画面のスクショなど・任意）</label>
                            <div id="pw-f-photo-preview" class="pw-photo-preview hidden">
                                <img id="pw-f-photo-img" alt="登録済みの写真">
                                <button type="button" class="btn btn-text" onclick="removePwPhoto()">写真を削除</button>
                            </div>
                            <button type="button" class="btn btn-secondary" id="pw-f-photo-btn" style="width:auto;" onclick="document.getElementById('pw-f-photo-input').click()">画像を選択</button>
                            <input type="file" id="pw-f-photo-input" accept="image/*" style="display:none;" onchange="handlePwPhotoSelect(this)">
                        </div>
                    </div>
                </div>
                <div class="wizard-footer">
                    <div class="wizard-footer-spacer"></div>
                    <button class="btn btn-text" onclick="closePwModal()">キャンセル</button>
                    <button id="pw-f-back-btn" class="btn btn-secondary" onclick="pwWizardBack()" style="display:none;">戻る</button>
                    <button id="pw-f-next-btn" class="btn btn-primary" onclick="pwWizardNext()">次へ</button>
                </div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
    <script src="search.js"></script>
    <script src="passwords.js"></script>
</body>
</html>
