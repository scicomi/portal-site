<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>実験ネタ | SciComi Portal</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header"></header>

    <main class="container">
        <div class="page-section-actions">
            <h1 class="page-title" style="margin:0; flex:1;">実験ネタ</h1>
            <div class="search-box" role="search">
                <input id="exp-search" class="search-input" type="search" placeholder="名前・材料で検索"
                    aria-label="実験を検索"
                    role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="exp-search-suggest"
                    autocomplete="off">
                <ul id="exp-search-suggest" class="search-suggest" role="listbox" aria-label="検索候補" hidden></ul>
            </div>
            <button class="btn btn-primary page-new-btn" onclick="openExpWizard()">＋ 実験を追加</button>
        </div>

        <!-- 新規実験の募集案内（管理者が編集。フォームURL・注意文を掲載） -->
        <div id="exp-recruit-card" class="exp-recruit-card hidden">
            <div class="exp-recruit-header">
                <h3>&#x1F4E2; 新規実験を募集中</h3>
                <button type="button" id="exp-recruit-edit-btn" class="expd-section-edit-btn hidden" title="編集" onclick="editExpRecruit()">&#9998;</button>
            </div>
            <div id="exp-recruit-body"></div>
        </div>

        <div class="page-section-actions">
            <button class="filter-chip active" data-cat="workshop" aria-pressed="true" onclick="switchExpTab('workshop')">工作 <span id="tab-cnt-workshop">0</span></button>
            <button class="filter-chip" data-cat="show" aria-pressed="false" onclick="switchExpTab('show')">実験ショー <span id="tab-cnt-show">0</span></button>
            <button class="filter-chip" data-cat="other" aria-pressed="false" onclick="switchExpTab('other')">その他 <span id="tab-cnt-other">0</span></button>
        </div>

        <div class="table-wrapper">
            <table class="data-table" id="experiments-table">
                <thead>
                    <tr>
                        <th>実験名</th>
                        <th class="hide-mobile">使用物品</th>
                        <th class="hide-mobile">資料</th>
                        <th style="width:1px;"></th>
                    </tr>
                </thead>
                <tbody id="experiments-tbody"><tr><td colspan="4" class="loading-text">読み込み中</td></tr></tbody>
            </table>
        </div>

        <!-- 詳細モーダルは廃止。閲覧は experiment-detail.html（実験詳細ページ）へ一本化 -->
    </main>

    <!-- FAB -->
    <button class="fab" onclick="openExpWizard()" aria-label="実験を追加"><span class="fab-icon">＋</span>実験を追加</button>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
    <script src="search.js"></script>
    <script src="experiments.js"></script>
</body>
</html>
